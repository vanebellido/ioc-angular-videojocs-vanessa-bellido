<form
  class="filtres"
  #formulariFiltres="ngForm"
  (ngSubmit)="aplicaFiltres()"
  aria-label="Filtres del catàleg"
>
  <div class="camp">
    <label for="text">Text de cerca</label>
    <input
      id="text"
      name="text"
      type="search"
      [(ngModel)]="filtres.text"
      #campText="ngModel"
      required
      minlength="3"
      placeholder="Mínim 3 caràcters"
      aria-describedby="text-ajuda text-error"
    />
    <span id="text-ajuda" class="ajuda">
      Camp obligatori: escriviu un mínim de 3 caràcters per filtrar.
    </span>

    @if (campText.invalid && (campText.dirty || campText.touched)) {
      <strong id="text-error" class="error" role="alert">
        @if (campText.errors?.['required']) {
          El text de cerca és obligatori.
        } @else if (campText.errors?.['minlength']) {
          La cerca ha de tenir 3 caràcters com a mínim.
        }
      </strong>
    }
  </div>

  <div class="camp">
    <label for="categoria">Categoria</label>
    <select
      id="categoria"
      name="categoria"
      [(ngModel)]="filtres.categoria"
    >
      @for (categoria of categories; track categoria) {
        <option [ngValue]="categoria">{{ categoria }}</option>
      }
    </select>
  </div>

  <div class="accions">
    <button
      type="submit"
      [disabled]="formulariFiltres.invalid"
    >
      Aplicar filtres
    </button>
    <button
      type="button"
      class="secundari"
      (click)="restableixFiltres()"
    >
      Restablir
    </button>
  </div>
</form>
